<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b2a" />
  <!-- "Add to Home Screen" opens the game without browser bars, in landscape -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Star Chasers" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Star Chasers / Звёздные гонщики</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #0b0b2a; height: 100%; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
    }
    /* Pinned to the visible viewport: on phones 100vh includes the hidden
       browser bars, which pushed the bottom of the canvas off screen. */
    #game {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      display: flex; align-items: center; justify-content: center; touch-action: none;
    }
    #rotate {
      position: fixed; inset: 0; z-index: 20; background: #0b0b2a; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font: 600 20px/1.3 system-ui, sans-serif; text-align: center; padding: 24px;
    }
    #rotate[hidden] { display: none; }
    #rotate .phone {
      width: 56px; height: 96px; border: 5px solid #fff; border-radius: 12px;
      animation: turn 1.8s ease-in-out infinite;
    }
    #rotate small { font-weight: 400; font-size: 16px; opacity: .75; }
    @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" hidden>
    <div class="phone"></div>
    <div>Поверните устройство<br /><small>Rotate your device to landscape</small></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
