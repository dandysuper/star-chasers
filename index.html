<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Star Chasers / Звёздные гонщики</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #0b0b2a; height: 100%; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
    }
    #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; touch-action: none; }
    #blockly-div { position: absolute; z-index: 10; touch-action: manipulation; }
    /* Blockly paints the toolbox category labels near-black, which vanishes on
       the dark toolbox it also paints. The selectors carry the container id so
       they outrank Blockly's own stylesheet whatever order the styles land in. */
    #blockly-div .blocklyTreeRow,
    #blockly-div .blocklyTreeLabel { color: #e8eaff; }
    #blockly-div .blocklyTreeRow:hover,
    #blockly-div .blocklyTreeRow:hover .blocklyTreeLabel { color: #ffffff; }
    /* A selected category is filled with its own colour, so the label flips
       back to dark to stay readable on that brighter fill. */
    #blockly-div .blocklyTreeRow.blocklyTreeSelected,
    #blockly-div .blocklyTreeRow.blocklyTreeSelected .blocklyTreeLabel { color: #101028; }
    #blockly-div .blocklyFlyoutLabelText { fill: #e8eaff; }
    #ui-overlay { position: absolute; z-index: 20; pointer-events: none; top: 0; left: 0; }
    .rs-button {
      pointer-events: auto; display: block; margin: 6px; padding: 12px 20px;
      font: 700 16px/1.1 system-ui, sans-serif; color: #fff; background: #2b2d5c;
      border: 3px solid #ffd23f; border-radius: 12px; cursor: pointer;
      touch-action: manipulation;
    }
    .rs-button:hover, .rs-button:active { background: #3d3f7a; }
  </style>
</head>
<body>
  <div id="blockly-div"></div>
  <div id="ui-overlay"></div>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
